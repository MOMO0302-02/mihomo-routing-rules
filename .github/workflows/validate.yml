name: Validate rules

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MIHOMO_VERSION: v1.19.30

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tools/validate_rules.py

  core-load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download Mihomo core
        run: |
          curl -fsSL -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
      - name: Load every rule in the real core
        run: python tools/coretest.py --binary ./mihomo
