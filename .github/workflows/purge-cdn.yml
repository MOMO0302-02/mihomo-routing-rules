name: Purge jsDelivr cache

on:
  push:
    branches: [release]

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Purge every published file
        run: |
          failed=0
          for f in rules/*.yaml manifest.json; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${f}"
            if curl -fsS --max-time 30 "$url" > /dev/null; then
              echo "purged $f"
            else
              echo "purge failed: $f" >&2
              failed=1
            fi
            sleep 1
          done
          exit $failed
